# 검사 (T9-2): push·PR마다 테스트와 빌드를 돌린다.
# 배포는 하지 않으므로 비공개 저장소에서도 안전하다 (GitHub Actions 무료 사용 시간 안에서 동작).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
