<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SQLD 시험 대비 개인용 문제은행·모의고사" />
    <title>SQLD 문제은행</title>
    <script>
      // 저장된 테마를 첫 화면이 그려지기 전에 적용한다 (새로고침 시 흰 화면 번쩍임 방지).
      // 키 이름은 src/app/theme.tsx의 STORAGE_KEY와 같아야 한다.
      try {
        var t = localStorage.getItem('sqld-bank.theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
